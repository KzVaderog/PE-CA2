name: Housing Price ML CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest test_app.py

      - name: Build Docker Image
        run: |
          docker build -t ca2-housing-api:latest .

      - name: Test Docker Container Run
        run: |
          docker run -d -p 8000:8000 --name test_app ca2-housing-api:latest
          sleep 5
          curl --fail http://localhost:8000/ || exit 1